[project]
name = "gbg-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "arabic-reshaper>=3.0.1",
    "chromadb>=1.5.9",
    "deepeval>=4.2.1",
    "easyocr>=1.7.2",
    "opencv-python>=4.11.0.86",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-community<0.4",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "ollama>=0.6.2",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "portalocker[win32]>=4.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-bidi>=0.6.11",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.63.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" }
]
torchvision = [
    { index = "pytorch-cu126" }
]
torchaudio = [
    { index = "pytorch-cu126" }
]
